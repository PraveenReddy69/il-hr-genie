name: Deploy HR console to GitHub Pages

# Only the console is deployed; the Android app is not part of this.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  # So you can redeploy after changing the API URL without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run replaces a waiting one, but never cancels a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Fails the build rather than shipping a console that cannot reach anything.
      - name: Check the API URL is set
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable" \
                 "(Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - run: npm run build
        env:
          # The site is served from /<repo>/, so assets and routes need that prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Baked in at build time — a change here needs a redeploy, which is what
          # workflow_dispatch above is for when the tunnel address moves.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
